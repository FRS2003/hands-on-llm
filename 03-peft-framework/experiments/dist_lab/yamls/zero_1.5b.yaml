### 实验B：ZeRO 逐级省显存（Qwen2.5-1.5B 全参 SFT，固定 2 卡）
### 同一 yaml 分别叠加 ds_zero1/2/3.json 或不叠加(=DDP)，对比每卡显存/能否跑通/步速
### model
model_name_or_path: /root/autodl-tmp/models/ms_cache/Qwen/Qwen2___5-1___5B
### method
stage: sft
do_train: true
finetuning_type: full
### dataset
dataset: zh_instruct_3k
dataset_dir: /root/autodl-tmp/workspace/peft_lab/data
template: qwen
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 8
### output
output_dir: /root/autodl-tmp/workspace/dist_lab/runs/zero15
logging_steps: 5
save_steps: 100000
overwrite_output_dir: true
### train：每卡 micro-batch=1，2卡×accum8=全局16；只跑30步即足以比较显存与稳定步速
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 30
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42
ddp_timeout: 180000000