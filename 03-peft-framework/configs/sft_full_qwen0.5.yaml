# ============================================================
# 全参数 SFT 基线（显存充足时用，作为 LoRA/QLoRA 的效果上界对照）
# 与 LoRA 模板的唯一差别：finetuning_type=full、学习率更小
# ============================================================
model_name_or_path: Qwen/Qwen2.5-0.5B

stage: sft
do_train: true
finetuning_type: full        # 全参数训练，所有权重都更新

dataset: my_instruction
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: saves/qwen0.5-sft-full
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5        # 全参学习率要比 LoRA 小一两个数量级
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true